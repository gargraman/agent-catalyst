; PgBouncer — transaction-mode connection pooler for the app (RLS) role (feature 021, D4).
;
; WHY transaction mode: the request path sets its tenant with `SET LOCAL app.workspace_id` INSIDE each
; request transaction (api/tenancy.set_workspace_scope), so the GUC is discarded at COMMIT and a server
; connection returned to the pool between transactions never carries one request's tenant into the next
; (proven by tests/test_pgbouncer_txn_isolation.py). This is the ONLY pool mode that is safe with per-request
; SET LOCAL — session mode would pin a server conn per client (no scaling win) and statement mode would break
; multi-statement transactions.
;
; WHO goes through here: ONLY the non-superuser app role `ac_app` (AC_APP_DATABASE_URL). The migration/owner
; role `ac` (AC_DATABASE_URL / AC_DATABASE_SYNC_URL) connects DIRECT to Postgres — migrations and the
; BYPASSRLS owner engine must never share txn-pooled server state (db.py keeps the URLs separate).

[databases]
; Server-side auth is pinned here (user+password) so PgBouncer authenticates to Postgres as ac_app with the
; known dev password and this pool never forwards client credentials. Dev-only password — prod injects the real
; one from the secret store (AWS Secrets Manager, feature 014) and should prefer scram auth_query over a static
; userlist. host/port target the in-network Postgres service.
agent_catalyst = host=postgres port=5432 dbname=agent_catalyst user=ac_app password=ac_app_pw

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction

; Client-side auth: md5 against userlist.txt. md5 is used (not scram) so the committed userlist is REPRODUCIBLE
; across a fresh Postgres volume — a scram verifier embeds a role-creation salt and would not match a re-created
; ac_app. Dev-only; a hardened deployment uses auth_query/scram, not a checked-in userlist.
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; asyncpg sends this server-setting on connect; it is not poolable in txn mode, so ignore it at startup rather
; than refuse the connection (standard PgBouncer + asyncpg guidance).
ignore_startup_parameters = extra_float_digits

max_client_conn = 200
default_pool_size = 25
; Admin/stats console access (dev): `psql -p 6432 -U ac_app pgbouncer` → SHOW POOLS;
admin_users = ac_app
stats_users = ac_app
