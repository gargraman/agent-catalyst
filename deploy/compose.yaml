# Dev-only compose stack for local TDD (M0+). M11 hardens this (healthchecks tuned,
# Vault/MinIO/Langfuse+ClickHouse added, resource limits, prod overlay).
# Postgres ships the pgvector extension via the pgvector image (01L: Postgres 16 + pgvector).
name: agent-catalyst-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ac
      POSTGRES_PASSWORD: ac_dev_pw          # dev-only; real secrets come from Vault (09). Never a real cred.
      POSTGRES_DB: agent_catalyst
    ports:
      - "5433:5432"                          # host 5433 to avoid clashing with a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ac -d agent_catalyst"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"                          # host 6380 to avoid clashing with a local Redis on 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
