# Dev-only compose stack for local TDD (M0+). Adds (feature 022) object storage via LocalStack S3 (same emulator
# as secrets — prod uses real AWS S3) + a profiled, OFF-by-default observability PLACEHOLDER (ClickHouse/Langfuse
# — not v3-ready; see §Observability below). M11 hardens this (resource limits, real Langfuse-v3 topology, prod
# overlay). Postgres ships the pgvector extension via the pgvector image (01L: Postgres 16 + pgvector).
name: agent-catalyst-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ac
      POSTGRES_PASSWORD: ac_dev_pw          # dev-only; real secrets come from Vault (09). Never a real cred.
      POSTGRES_DB: agent_catalyst
    ports:
      - "5433:5432"                          # host 5433 to avoid clashing with a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ac -d agent_catalyst"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"                          # host 6380 to avoid clashing with a local Redis on 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Transaction-mode connection pooler for the APP (RLS) role only (feature 021, D4). The request path sets its
  # tenant with `SET LOCAL app.workspace_id` inside each request transaction, so a server connection returned to
  # the pool between transactions never carries one request's tenant into the next (txn-mode safe; proven by
  # tests/test_pgbouncer_txn_isolation.py). The migration/owner role `ac` stays DIRECT to Postgres — migrations
  # and the BYPASSRLS owner engine must never share txn-pooled server state. Config is mounted read-only.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    ports:
      - "6432:6432"                          # host 6432 → the txn-mode pooler (app role)
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ac_app -d agent_catalyst"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Local AWS emulator: secret custody (feature 014 — Secrets Manager + KMS) AND object storage (feature 022 — S3).
  # Stands in for the real AWS account locally so the SAME boto3 code path runs in dev; prod talks to real AWS
  # (Secrets Manager + S3) via an IAM role, no endpoint override. Dev-only; no real cloud, no real creds. The S3
  # buckets (ac-uploads, langfuse) are created by the mounted init hook once LocalStack is ready (idempotent).
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"                          # LocalStack edge (Secrets Manager, KMS, S3)
    environment:
      SERVICES: secretsmanager,kms,s3
      DEBUG: "0"
    volumes:
      - ./localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro   # creates S3 buckets on ready
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot migration step — applies Alembic migrations as the superuser `ac` (creates ac_app + RLS policies)
  # BEFORE the API starts. Exits 0 on success; the api service waits on its completion.
  migrate:
    build:
      context: ../services
    command: ["alembic", "upgrade", "head"]
    environment:
      AC_DATABASE_SYNC_URL: postgresql+psycopg://ac:ac_dev_pw@postgres:5432/agent_catalyst
      # Dev profile (feature 023): settings default to prod (fail closed), and prod requires
      # AC_TELEMETRY_FINGERPRINT_KEY — a prod migrate job must inject it like the api does.
      AC_ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The FastAPI service, built from services/Dockerfile. Dev profile: AC_ENV=dev + AC_AUTH_PROVIDER=dev enable
  # the (unverified) dev auth provider — feature 012 is FAIL-CLOSED by default. A real deployment sets
  # AC_ENV=prod + AC_AUTH_PROVIDER=trellix-iam (+ AC_IAM_* config) and injects creds from a secret store (Vault).
  api:
    build:
      context: ../services
    ports:
      - "8000:8000"
    environment:
      # Owner/migration role → DIRECT to Postgres (BYPASSRLS; must not share txn-pooled state, feature 021 D4).
      AC_DATABASE_URL: postgresql+asyncpg://ac:ac_dev_pw@postgres:5432/agent_catalyst
      AC_DATABASE_SYNC_URL: postgresql+psycopg://ac:ac_dev_pw@postgres:5432/agent_catalyst
      # App (RLS) role → through PgBouncer in transaction mode (feature 021 D4). SET LOCAL app.workspace_id is
      # txn-scoped, so a pooled server connection never leaks one request's tenant into the next.
      AC_APP_DATABASE_URL: postgresql+asyncpg://ac_app:ac_app_pw@pgbouncer:6432/agent_catalyst
      AC_REDIS_URL: redis://redis:6379/0
      AC_ENV: dev                            # dev-only; prod sets prod + trellix-iam (see note above)
      AC_AUTH_PROVIDER: dev
      # Secret custody (feature 014): drive the real boto3 path against LocalStack in dev. Prod sets
      # AC_SECRETS_PROVIDER=aws with no endpoint override (real AWS) + an IAM role, not static creds.
      AC_SECRETS_PROVIDER: aws
      AC_AWS_ENDPOINT_URL: http://localstack:4566
      AC_AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test                # dev-only dummy creds for LocalStack (Secrets Manager + S3) — never real
      AWS_SECRET_ACCESS_KEY: test
      # Object storage (feature 022): S3 reuses the SAME LocalStack endpoint + AWS creds as secrets above — no new
      # env needed locally. Wired as INFRASTRUCTURE only; no Settings field reads a bucket name yet. When the
      # app-side S3 client lands, add AC_S3_BUCKET (e.g. ac-uploads) + boto3 client("s3", endpoint_url=AC_AWS_ENDPOINT_URL).
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Observability PLACEHOLDER (feature 022 §2) — profiled OFF; `docker compose up` IGNORES these. -----------
  # ⚠️ NOT Langfuse-v3-ready. Real v3 is a multi-container topology (langfuse-web + langfuse-worker + a ClickHouse
  # init/migration step + ENCRYPTION_KEY/SALT/NEXTAUTH_URL + a full LANGFUSE_S3_* block) and will REPLACE these
  # stubs when observability is actually turned on. These exist only so the turn-on seam is visible and
  # `docker compose --profile observability config` parses — they are NOT expected to come up green as-is.
  clickhouse:
    image: clickhouse/clickhouse-server      # PLACEHOLDER — pin at turn-on (docs/backend/11)
    profiles: ["observability"]
    environment:
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse          # dev-only dummy
    volumes:
      - chdata:/var/lib/clickhouse

  langfuse:
    image: langfuse/langfuse:3               # PLACEHOLDER tag — real v3 pinned-by-digest at turn-on (docs/backend/11)
    profiles: ["observability"]
    environment:
      # PLACEHOLDER env only — v3 additionally requires a `langfuse` Postgres DB, ENCRYPTION_KEY (32-byte hex),
      # SALT, NEXTAUTH_URL, and the LANGFUSE_S3_* block (endpoint/creds/force-path-style → the `langfuse` bucket
      # on LocalStack S3 locally / real AWS S3 in prod).
      DATABASE_URL: postgresql://ac:ac_dev_pw@postgres:5432/langfuse
      NEXTAUTH_SECRET: dev
    depends_on:
      - clickhouse
      - localstack
    ports:
      - "3001:3000"

volumes:
  pgdata:
  chdata:
