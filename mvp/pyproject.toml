[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-catalyst-mvp"
version = "0.1.0"
description = "Standalone viability experiment for Agent Catalyst; H2 adapters implemented, H1 pending."
requires-python = ">=3.12"
# Current OpenAI/Ollama HTTP adapters use the standard library; pytest is a development dependency.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
# flat layout: top-level modules + packages, installed from this (mvp/) dir
py-modules = ["ir", "cost", "log", "run"]

[tool.setuptools.packages.find]
include = ["profiles*", "evals*", "providers*", "experiments*"]

[tool.setuptools.package-data]
profiles = ["*.json"]

[tool.pytest.ini_options]
# run pytest from inside mvp/; put this dir on sys.path so `import ir` / `from evals...` resolve
# whether or not the editable install is active.
pythonpath = ["."]
testpaths = ["tests"]
