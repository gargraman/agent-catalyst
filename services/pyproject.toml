[project]
name = "agent-catalyst-services"
version = "0.0.0"
description = "Agent Catalyst backend services (api · runtime · evals · ingestion)"
requires-python = ">=3.12"
# Base = the infra-free core the unit run needs: settings (pydantic-settings) + runtime schema
# validation (jsonschema). DB/Redis/FastAPI deps live in [api] and are exercised in the integration batch.
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "jsonschema>=4",
]

[project.optional-dependencies]
# psycopg (sync) is required by Alembic's SYNC_URL; asyncpg drives the async request/job path.
api = ["fastapi", "uvicorn", "sqlalchemy>=2.0", "asyncpg", "psycopg[binary]>=3", "alembic", "redis"]
test = ["pytest>=8", "pytest-asyncio"]

[tool.pytest.ini_options]
# Make the services/ root importable (api.*, runtime.*, evals.*) without an install step.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires the local compose stack (Postgres/Redis/Vault/MinIO) — skipped in the unit run",
]
